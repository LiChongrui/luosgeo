<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>七夕 · 我喜欢你</title>
    <style>
        /* === 全局重置 === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh; /* 动态视口高度，移动端更好用 */
            background: radial-gradient(ellipse at 40% 30%, #fcf4f7 0%, #f5e6ed 60%, #f0e0e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 12px;
            overflow: hidden; /* 防止滚动条干扰缩放 */
        }

        /* === 外层容器 — 负责居中与缩放 === */
        .scale-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            transform-origin: center center;
            transition: transform 0.15s ease-out;
        }

        /* === 卡片容器 — 固定设计尺寸 === */
        .card {
            width: 460px;          /* 设计基准宽度 */
            height: 818px;         /* 460 / 9 * 16 ≈ 818px (9:16 比例) */
            aspect-ratio: 9 / 16;
            background: rgba(255, 245, 248, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            border: 1.5px solid rgba(255, 220, 235, 0.5);
            box-shadow: 0 20px 60px rgba(180, 100, 130, 0.12);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px 28px;
            flex-shrink: 0;        /* 防止被压缩 */
        }

        /* === 背景光晕 === */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(255, 150, 180, 0.15) 0%, transparent 70%);
            animation: glowPulse 5s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes glowPulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.06); opacity: 1; }
        }

        /* === 背景装饰 — 全部使用固定尺寸（相对于卡片） === */
        .deco-heart-1 {
            position: absolute;
            top: 4%;
            left: 3%;
            font-size: 56px;
            opacity: 0.12;
            color: #f5a0b8;
            animation: floatDeco1 18s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatDeco1 {
            0% { transform: translate(0, 0) rotate(0deg); }
            40% { transform: translate(12px, -24px) rotate(12deg); }
            80% { transform: translate(-6px, 16px) rotate(-6deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .deco-heart-2 {
            position: absolute;
            bottom: 4%;
            right: 3%;
            font-size: 64px;
            opacity: 0.10;
            color: #f7b8c8;
            animation: floatDeco2 22s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatDeco2 {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-16px, 12px) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .deco-stars {
            position: absolute;
            font-size: 24px;
            color: #f7d0b0;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            letter-spacing: 8px;
        }
        .deco-stars.top-left { top: 14%; left: 4%; animation: spinStar1 14s linear infinite; }
        .deco-stars.top-right { top: 10%; right: 4%; animation: spinStar2 16s linear infinite; }
        .deco-stars.bottom-left { bottom: 18%; left: 3%; animation: spinStar1 18s linear infinite; }
        .deco-stars.bottom-right { bottom: 14%; right: 3%; animation: spinStar2 20s linear infinite; }
        @keyframes spinStar1 {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        @keyframes spinStar2 {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(-180deg) scale(1.15); }
            100% { transform: rotate(-360deg) scale(1); }
        }

        .deco-cloud {
            position: absolute;
            font-size: 80px;
            color: rgba(255, 255, 255, 0.12);
            pointer-events: none;
            z-index: 0;
        }
        .deco-cloud.top { top: 6%; left: 10%; animation: cloudMove1 28s ease-in-out infinite; }
        .deco-cloud.bottom { bottom: 8%; right: 8%; animation: cloudMove2 30s ease-in-out infinite; }
        @keyframes cloudMove1 {
            0% { transform: translateX(0); }
            50% { transform: translateX(30px); }
            100% { transform: translateX(0); }
        }
        @keyframes cloudMove2 {
            0% { transform: translateX(0); }
            50% { transform: translateX(-24px); }
            100% { transform: translateX(0); }
        }

        .deco-flower {
            position: absolute;
            font-size: 40px;
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
        }
        .deco-flower.left { left: 4%; bottom: 28%; animation: swayFlower1 16s ease-in-out infinite; }
        .deco-flower.right { right: 4%; top: 28%; animation: swayFlower2 18s ease-in-out infinite; }
        @keyframes swayFlower1 {
            0% { transform: rotate(-10deg) translate(0, 0); }
            50% { transform: rotate(14deg) translate(6px, -8px); }
            100% { transform: rotate(-10deg) translate(0, 0); }
        }
        @keyframes swayFlower2 {
            0% { transform: rotate(12deg) translate(0, 0); }
            50% { transform: rotate(-12deg) translate(-5px, 10px); }
            100% { transform: rotate(12deg) translate(0, 0); }
        }

        .deco-scatter {
            position: absolute;
            font-size: 24px;
            opacity: 0.06;
            color: #f5a0b8;
            pointer-events: none;
            z-index: 0;
        }
        .deco-scatter:nth-child(1) { top: 48%; left: 6%; animation: scatter1 15s ease-in-out infinite; }
        .deco-scatter:nth-child(2) { top: 55%; right: 5%; animation: scatter2 17s ease-in-out infinite; }
        .deco-scatter:nth-child(3) { top: 72%; left: 12%; animation: scatter3 19s ease-in-out infinite; }
        .deco-scatter:nth-child(4) { top: 22%; right: 10%; animation: scatter4 13s ease-in-out infinite; }
        .deco-scatter:nth-child(5) { top: 38%; left: 18%; animation: scatter5 21s ease-in-out infinite; }

        @keyframes scatter1 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(10px,-14px) rotate(18deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes scatter2 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-12px,16px) rotate(-16deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes scatter3 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(14px,-10px) rotate(22deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes scatter4 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-8px,12px) rotate(-20deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes scatter5 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(12px,-10px) rotate(15deg); } 100% { transform: translate(0,0) rotate(0deg); } }

        /* === 内容区域 === */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            gap: 6px;
        }

        /* === 顶部装饰 === */
        .top-ornaments {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 28px;
            opacity: 0.5;
            margin-bottom: 4px;
        }
        .top-ornaments .heart-icon {
            color: #f28aa8;
            animation: pulseHeart 2.4s ease-in-out infinite;
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        /* === 主标题 === */
        .title-qixi {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: 14px;
            background: linear-gradient(135deg, #f5a0b8, #f7b8c8, #f0b0c0);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleShimmer 6s ease-in-out infinite alternate;
            line-height: 1.1;
            text-shadow: 0 4px 40px rgba(240, 150, 180, 0.12);
        }
        @keyframes titleShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* === 副标题 === */
        .sub-greeting {
            font-size: 14px;
            font-weight: 300;
            color: #b3889a;
            background: rgba(255, 220, 235, 0.30);
            padding: 6px 24px;
            border-radius: 80px;
            border: 1px solid rgba(255, 200, 215, 0.25);
            letter-spacing: 6px;
            display: inline-block;
            backdrop-filter: blur(2px);
            margin-bottom: 2px;
        }

        /* === 告白语 === */
        .confession {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 12px;
            background: linear-gradient(135deg, #f58aa8, #f06a90, #e8557a);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: confessionGlow 3s ease-in-out infinite alternate;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 60px rgba(235, 80, 120, 0.08);
        }
        @keyframes confessionGlow {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 16px rgba(255, 59, 127, 0.12)); }
            100% { background-position: 100% 50%; filter: drop-shadow(0 0 32px rgba(255, 59, 127, 0.20)); }
        }

        .confession::before {
            content: '☁️';
            position: absolute;
            left: -52px;
            top: -22px;
            font-size: 30px;
            opacity: 0.30;
            animation: cloudFloat 5s ease-in-out infinite alternate;
        }
        .confession::after {
            content: '🌸';
            position: absolute;
            right: -58px;
            bottom: -18px;
            font-size: 32px;
            opacity: 0.30;
            animation: flowerFloat 6s ease-in-out infinite alternate;
        }
        @keyframes cloudFloat {
            0% { transform: translateY(0) scale(0.9); opacity: 0.20; }
            100% { transform: translateY(-10px) scale(1.1); opacity: 0.40; }
        }
        @keyframes flowerFloat {
            0% { transform: rotate(-6deg) scale(0.9); opacity: 0.20; }
            100% { transform: rotate(12deg) scale(1.1); opacity: 0.40; }
        }

        /* === 爱心雨 === */
        .falling-hearts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            font-size: 28px;
            margin: 8px 0;
            filter: drop-shadow(0 4px 20px rgba(255, 130, 170, 0.06));
        }
        .falling-hearts span {
            display: inline-block;
            animation: heartFloat 4.2s ease-in-out infinite alternate;
        }
        .falling-hearts span:nth-child(1) { animation-delay: 0s; }
        .falling-hearts span:nth-child(2) { animation-delay: 0.4s; }
        .falling-hearts span:nth-child(3) { animation-delay: 0.9s; }
        .falling-hearts span:nth-child(4) { animation-delay: 1.5s; }
        .falling-hearts span:nth-child(5) { animation-delay: 0.6s; }
        .falling-hearts span:nth-child(6) { animation-delay: 2.0s; }
        .falling-hearts span:nth-child(7) { animation-delay: 1.2s; }
        .falling-hearts span:nth-child(8) { animation-delay: 0.8s; }

        @keyframes heartFloat {
            0% { transform: translateY(6px) scale(0.85) rotate(-6deg); opacity: 0.5; }
            100% { transform: translateY(-12px) scale(1.1) rotate(8deg); opacity: 1; }
        }

        /* === 诗句 === */
        .poem-card {
            max-width: 94%;
            margin: 4px 0;
        }
        .poem-line {
            font-size: 16px;
            color: #7a5f6b;
            letter-spacing: 2px;
            font-weight: 300;
            line-height: 1.6;
        }
        .poem-line i {
            font-style: normal;
            color: #d47a96;
            font-weight: 400;
        }
        .poem-line small {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            opacity: 0.6;
            letter-spacing: 3px;
            color: #b28a98;
        }

        /* === SVG 牛郎织女 === */
        .lovers-svg-container {
            width: 100%;
            max-width: 380px;
            margin: 4px 0;
            display: flex;
            justify-content: center;
        }
        .lovers-svg-container svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* === 底部 === */
        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-top: 8px;
        }
        .date-tag {
            font-size: 11px;
            color: #b58a98;
            background: rgba(255, 230, 240, 0.30);
            padding: 4px 20px;
            border-radius: 80px;
            letter-spacing: 4px;
            border: 1px solid rgba(255, 200, 215, 0.15);
            backdrop-filter: blur(2px);
        }
        .date-tag strong {
            color: #d47a96;
            font-weight: 400;
        }
        .motto {
            font-size: 10px;
            color: #b3929e;
            opacity: 0.5;
            border-top: 1px solid rgba(200, 150, 170, 0.10);
            padding-top: 6px;
            width: 70%;
            text-align: center;
        }

        /* === 极窄屏：隐藏部分装饰 === */
        @media (max-width: 480px) {
            .deco-scatter,
            .deco-stars {
                display: none;
            }
        }

        @media (max-width: 400px) {
            .deco-flower,
            .deco-cloud {
                display: none;
            }
            .confession::before,
            .confession::after {
                display: none;
            }
        }

        /* === 高度不足时：减小内边距 === */
        @media (max-height: 700px) {
            .card {
                padding: 20px 20px;
            }
            .content {
                gap: 3px;
            }
            .top-ornaments {
                gap: 10px;
                font-size: 20px;
                margin-bottom: 2px;
            }
            .title-qixi {
                font-size: 52px;
                letter-spacing: 10px;
            }
            .sub-greeting {
                font-size: 11px;
                padding: 4px 16px;
                letter-spacing: 4px;
            }
            .confession {
                font-size: 40px;
                letter-spacing: 8px;
            }
            .falling-hearts {
                gap: 8px;
                font-size: 20px;
                margin: 4px 0;
            }
            .poem-line {
                font-size: 13px;
            }
            .lovers-svg-container {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 缩放外层 ===== -->
    <div class="scale-wrapper" id="scaleWrapper">

        <div class="card">

            <!-- 纯CSS背景装饰 -->
            <div class="deco-heart-1">❤️</div>
            <div class="deco-heart-2">💗</div>
            <div class="deco-stars top-left">✦ ✧</div>
            <div class="deco-stars top-right">✧ ✦</div>
            <div class="deco-stars bottom-left">✦ ✧</div>
            <div class="deco-stars bottom-right">✧ ✦</div>
            <div class="deco-cloud top">☁️</div>
            <div class="deco-cloud bottom">☁️</div>
            <div class="deco-flower left">🌸</div>
            <div class="deco-flower right">🌺</div>
            <div class="deco-scatter">💕</div>
            <div class="deco-scatter">💗</div>
            <div class="deco-scatter">💖</div>
            <div class="deco-scatter">💝</div>
            <div class="deco-scatter">💘</div>

            <!-- 主要内容 -->
            <div class="content">

                <div class="top-ornaments">
                    <span>✨</span>
                    <span>☁️</span>
                    <span class="heart-icon">💞</span>
                    <span>🌷</span>
                    <span>✨</span>
                </div>

                <h1 class="title-qixi">七 夕</h1>
                <div class="sub-greeting">✦ 星河为证 · 佳期如梦 ✦</div>

                <div class="confession">我喜欢你</div>

                <div class="falling-hearts">
                    <span>💖</span><span>🌸</span><span>💗</span><span>🌺</span>
                    <span>💕</span><span>💝</span><span>💘</span><span>❤️</span>
                </div>

                <div class="poem-card">
                    <div class="poem-line">
                        <i>两情若是久长时，又岂在朝朝暮暮</i>
                        <small>— 秦观 · 鹊桥仙 —</small>
                    </div>
                </div>

                <!-- 牛郎织女 SVG -->
                <div class="lovers-svg-container">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="100%" height="100%" style="font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: visible;">
                        <defs>
                            <linearGradient id="boyGrad_s" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#b8a0b0"/>
                                <stop offset="100%" stop-color="#8a7080"/>
                            </linearGradient>
                            <linearGradient id="girlGrad_s" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#e8a0b8"/>
                                <stop offset="100%" stop-color="#c88098"/>
                            </linearGradient>
                            <radialGradient id="faceGrad_s" cx="50%" cy="40%" r="50%">
                                <stop offset="0%" stop-color="#fff5f0"/>
                                <stop offset="100%" stop-color="#f0ddd8"/>
                            </radialGradient>
                            <filter id="shadow_s" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(120,80,100,0.15)"/>
                            </filter>
                        </defs>

                        <!-- 牛郎 (左侧) -->
                        <g transform="translate(80, 10)" filter="url(#shadow_s)">
                            <ellipse cx="0" cy="18" rx="60" ry="12" fill="rgba(180,140,160,0.06)"/>
                            <path d="M-16,38 L-12,20 L-4,16 L4,16 L12,20 L16,38 L12,42 L-12,42 Z" fill="url(#boyGrad_s)" opacity="0.9"/>
                            <path d="M-6,20 L-9,12 L9,12 L6,20" fill="none" stroke="#c0a8b8" stroke-width="1.2"/>
                            <path d="M-4,16 L0,12 L4,16 L0,20 Z" fill="#d4c0d0"/>
                            <ellipse cx="0" cy="4" rx="14" ry="16" fill="url(#faceGrad_s)"/>
                            <path d="M-14,0 Q-16,-8 -8,-12 Q-4,-14 0,-14 Q4,-14 8,-12 Q16,-8 14,0 Q8,-4 0,-4 Q-8,-4 -14,0 Z" fill="#5a4a50"/>
                            <path d="M-10,-9 Q-6,-17 -2,-16 Q3,-14 6,-17 Q9,-9 6,-6 Q0,-9 -6,-6 Q-10,-9 -10,-9 Z" fill="#5a4a50"/>
                            <line x1="0" y1="-16" x2="0" y2="-22" stroke="#e8c8a0" stroke-width="1.5"/>
                            <circle cx="0" cy="-22" r="2.5" fill="#e8c8a0"/>
                            <ellipse cx="-4.5" cy="3" rx="2.5" ry="3" fill="#3a2a30"/>
                            <ellipse cx="4.5" cy="3" rx="2.5" ry="3" fill="#3a2a30"/>
                            <ellipse cx="-4" cy="2.5" rx="1" ry="1" fill="white"/>
                            <ellipse cx="5" cy="2.5" rx="1" ry="1" fill="white"/>
                            <path d="M-8,0 Q-5,-1.5 -3,0" fill="none" stroke="#4a3a40" stroke-width="1.2"/>
                            <path d="M8,0 Q5,-1.5 3,0" fill="none" stroke="#4a3a40" stroke-width="1.2"/>
                            <path d="M-2.5,8 Q0,10.5 2.5,8" fill="none" stroke="#c07080" stroke-width="1.2"/>
                            <ellipse cx="-8" cy="6" rx="3" ry="2" fill="rgba(200,120,140,0.2)"/>
                            <ellipse cx="8" cy="6" rx="3" ry="2" fill="rgba(200,120,140,0.2)"/>
                            <path d="M-10,22 Q-16,18 -14,13 Q-12,10 -11,13" fill="url(#faceGrad_s)" stroke="#d0b8c0" stroke-width="0.8"/>
                            <path d="M10,22 Q16,18 14,13 Q12,10 11,13" fill="url(#faceGrad_s)" stroke="#d0b8c0" stroke-width="0.8"/>
                            <path d="M-12,28 Q-24,32 -20,44 Q-16,48 -14,40" fill="none" stroke="#c8a8b8" stroke-width="1.6" opacity="0.5">
                                <animateTransform attributeName="transform" type="rotate" values="-2,0,32;2,0,32;-2,0,32" dur="3s" repeatCount="indefinite"/>
                            </path>
                            <path d="M12,28 Q24,32 20,44 Q16,48 14,40" fill="none" stroke="#c8a8b8" stroke-width="1.6" opacity="0.5">
                                <animateTransform attributeName="transform" type="rotate" values="2,0,32;-2,0,32;2,0,32" dur="3.2s" repeatCount="indefinite"/>
                            </path>
                            <rect x="-24" y="44" width="48" height="18" rx="9" fill="rgba(255,240,245,0.5)" stroke="rgba(255,200,215,0.2)" stroke-width="0.8"/>
                            <text x="0" y="56" text-anchor="middle" font-size="11" fill="#7a5f6b" font-weight="400">牛郎</text>
                        </g>

                        <!-- 鹊桥 (中间) -->

    <!-- ===== 自适应缩放脚本 ===== -->
    <script>
        (function autoScale() {
            const wrapper = document.getElementById('scaleWrapper');
            const card = document.querySelector('.card');

            function updateScale() {
                const cardWidth = card.offsetWidth;   // 固定 460px
                const cardHeight = card.offsetHeight; // 固定 818px

                // 获取视口尺寸
                const vw = window.innerWidth;
                const vh = window.innerHeight;

                // 计算可用空间（减去边距）
                const padding = 24; // body 的 padding
                const availW = vw - padding * 2;
                const availH = vh - padding * 2;

                // 计算横向和纵向的缩放比
                const scaleX = availW / cardWidth;
                const scaleY = availH / cardHeight;

                // 取较小值，确保完整显示
                let scale = Math.min(scaleX, scaleY);

                // 限制最大缩放为 1（不放大超过设计尺寸）
                scale = Math.min(scale, 1);

                // 限制最小缩放（防止过小）
                scale = Math.max(scale, 0.3);

                // 应用缩放
                wrapper.style.transform = `scale(${scale})`;
            }

            // 初始执行
            updateScale();

            // 窗口变化时重新计算
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(updateScale, 80);
            });

            // 屏幕方向变化时重新计算
            window.addEventListener('orientationchange', function() {
                setTimeout(updateScale, 200);
            });
        })();
    </script>
