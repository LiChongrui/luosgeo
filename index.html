<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>七夕 · 我喜欢你</title>
    <style>
        /* === 全局重置 === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 40% 30%, #fcf4f7 0%, #f5e6ed 60%, #f0e0e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 16px;
        }

        /* === 竖屏卡片容器 === */
        .card {
            width: 100%;
            max-width: 460px;
            aspect-ratio: 9 / 16;
            background: rgba(255, 245, 248, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            border: 1.5px solid rgba(255, 220, 235, 0.5);
            box-shadow: 0 20px 60px rgba(180, 100, 130, 0.12);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(16px, 4vw, 32px);
            transition: all 0.2s;
        }

        /* === 背景光晕 === */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(255, 150, 180, 0.15) 0%, transparent 70%);
            animation: glowPulse 5s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes glowPulse {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.06); opacity: 1; }
        }

        /* === 背景装饰 — 纯CSS === */

        /* 漂浮爱心 — 左上 */
        .deco-heart-1 {
            position: absolute;
            top: 4%;
            left: 3%;
            font-size: clamp(32px, 7vw, 56px);
            opacity: 0.12;
            color: #f5a0b8;
            animation: floatDeco1 18s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatDeco1 {
            0% { transform: translate(0, 0) rotate(0deg); }
            40% { transform: translate(12px, -24px) rotate(12deg); }
            80% { transform: translate(-6px, 16px) rotate(-6deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* 漂浮爱心 — 右下 */
        .deco-heart-2 {
            position: absolute;
            bottom: 4%;
            right: 3%;
            font-size: clamp(36px, 8vw, 64px);
            opacity: 0.10;
            color: #f7b8c8;
            animation: floatDeco2 22s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatDeco2 {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-16px, 12px) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* 星星群 */
        .deco-stars {
            position: absolute;
            font-size: clamp(14px, 2.8vw, 24px);
            color: #f7d0b0;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            letter-spacing: 8px;
        }
        .deco-stars.top-left {
            top: 14%;
            left: 4%;
            animation: spinStar1 14s linear infinite;
        }
        .deco-stars.top-right {
            top: 10%;
            right: 4%;
            animation: spinStar2 16s linear infinite;
        }
        .deco-stars.bottom-left {
            bottom: 18%;
            left: 3%;
            animation: spinStar1 18s linear infinite;
        }
        .deco-stars.bottom-right {
            bottom: 14%;
            right: 3%;
            animation: spinStar2 20s linear infinite;
        }
        @keyframes spinStar1 {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        @keyframes spinStar2 {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(-180deg) scale(1.15); }
            100% { transform: rotate(-360deg) scale(1); }
        }

        /* 云朵 */
        .deco-cloud {
            position: absolute;
            font-size: clamp(40px, 10vw, 80px);
            color: rgba(255, 255, 255, 0.12);
            pointer-events: none;
            z-index: 0;
        }
        .deco-cloud.top {
            top: 6%;
            left: 10%;
            animation: cloudMove1 28s ease-in-out infinite;
        }
        .deco-cloud.bottom {
            bottom: 8%;
            right: 8%;
            animation: cloudMove2 30s ease-in-out infinite;
        }
        @keyframes cloudMove1 {
            0% { transform: translateX(0); }
            50% { transform: translateX(30px); }
            100% { transform: translateX(0); }
        }
        @keyframes cloudMove2 {
            0% { transform: translateX(0); }
            50% { transform: translateX(-24px); }
            100% { transform: translateX(0); }
        }

        /* 花朵 */
        .deco-flower {
            position: absolute;
            font-size: clamp(24px, 5vw, 40px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
        }
        .deco-flower.left {
            left: 4%;
            bottom: 28%;
            animation: swayFlower1 16s ease-in-out infinite;
        }
        .deco-flower.right {
            right: 4%;
            top: 28%;
            animation: swayFlower2 18s ease-in-out infinite;
        }
        @keyframes swayFlower1 {
            0% { transform: rotate(-10deg) translate(0, 0); }
            50% { transform: rotate(14deg) translate(6px, -8px); }
            100% { transform: rotate(-10deg) translate(0, 0); }
        }
        @keyframes swayFlower2 {
            0% { transform: rotate(12deg) translate(0, 0); }
            50% { transform: rotate(-12deg) translate(-5px, 10px); }
            100% { transform: rotate(12deg) translate(0, 0); }
        }

        /* 散落小爱心 */
        .deco-scatter {
            position: absolute;
            font-size: clamp(14px, 2.5vw, 24px);
            opacity: 0.06;
            color: #f5a0b8;
            pointer-events: none;
            z-index: 0;
        }
        .deco-scatter:nth-child(1) { top: 48%; left: 6%; animation: scatter1 15s ease-in-out infinite; }
        .deco-scatter:nth-child(2) { top: 55%; right: 5%; animation: scatter2 17s ease-in-out infinite; }
        .deco-scatter:nth-child(3) { top: 72%; left: 12%; animation: scatter3 19s ease-in-out infinite; }
        .deco-scatter:nth-child(4) { top: 22%; right: 10%; animation: scatter4 13s ease-in-out infinite; }
        .deco-scatter:nth-child(5) { top: 38%; left: 18%; animation: scatter5 21s ease-in-out infinite; }

        @keyframes scatter1 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(10px,-14px) rotate(18deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes scatter2 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-12px,16px) rotate(-16deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes scatter3 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(14px,-10px) rotate(22deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes scatter4 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-8px,12px) rotate(-20deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes scatter5 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(12px,-10px) rotate(15deg); } 100% { transform: translate(0,0) rotate(0deg); } }

        /* === 内容区域 === */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            gap: clamp(2px, 0.5vh, 8px);
        }

        /* === 顶部装饰 === */
        .top-ornaments {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 1.6vw, 18px);
            flex-wrap: wrap;
            font-size: clamp(16px, 2.8vw, 30px);
            opacity: 0.5;
            margin-bottom: clamp(2px, 0.3vh, 6px);
        }
        .top-ornaments .heart-icon {
            color: #f28aa8;
            animation: pulseHeart 2.4s ease-in-out infinite;
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        /* === 主标题 === */
        .title-qixi {
            font-size: clamp(36px, 10vw, 72px);
            font-weight: 700;
            letter-spacing: clamp(6px, 1.8vw, 14px);
            background: linear-gradient(135deg, #f5a0b8, #f7b8c8, #f0b0c0);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleShimmer 6s ease-in-out infinite alternate;
            line-height: 1.1;
            text-shadow: 0 4px 40px rgba(240, 150, 180, 0.12);
        }
        @keyframes titleShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* === 副标题 === */
        .sub-greeting {
            font-size: clamp(10px, 1.4vw, 15px);
            font-weight: 300;
            color: #b3889a;
            background: rgba(255, 220, 235, 0.30);
            padding: clamp(4px, 0.5vh, 8px) clamp(14px, 3vw, 28px);
            border-radius: 80px;
            border: 1px solid rgba(255, 200, 215, 0.25);
            letter-spacing: clamp(3px, 0.8vw, 8px);
            display: inline-block;
            backdrop-filter: blur(2px);
            margin-bottom: clamp(2px, 0.2vh, 4px);
        }

        /* === 告白语 === */
        .confession {
            font-size: clamp(30px, 7.5vw, 56px);
            font-weight: 700;
            letter-spacing: clamp(6px, 1.4vw, 12px);
            background: linear-gradient(135deg, #f58aa8, #f06a90, #e8557a);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: confessionGlow 3s ease-in-out infinite alternate;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 60px rgba(235, 80, 120, 0.08);
        }
        @keyframes confessionGlow {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 16px rgba(255, 59, 127, 0.12)); }
            100% { background-position: 100% 50%; filter: drop-shadow(0 0 32px rgba(255, 59, 127, 0.20)); }
        }

        /* 告白语两侧装饰 */
        .confession::before {
            content: '☁️';
            position: absolute;
            left: clamp(-32px, -5vw, -52px);
            top: clamp(-14px, -2vw, -22px);
            font-size: clamp(18px, 3vw, 30px);
            opacity: 0.30;
            animation: cloudFloat 5s ease-in-out infinite alternate;
        }
        .confession::after {
            content: '🌸';
            position: absolute;
            right: clamp(-36px, -5.5vw, -58px);
            bottom: clamp(-12px, -1.8vw, -18px);
            font-size: clamp(20px, 3.2vw, 32px);
            opacity: 0.30;
            animation: flowerFloat 6s ease-in-out infinite alternate;
        }
        @keyframes cloudFloat {
            0% { transform: translateY(0) scale(0.9); opacity: 0.20; }
            100% { transform: translateY(-10px) scale(1.1); opacity: 0.40; }
        }
        @keyframes flowerFloat {
            0% { transform: rotate(-6deg) scale(0.9); opacity: 0.20; }
            100% { transform: rotate(12deg) scale(1.1); opacity: 0.40; }
        }

        /* === 爱心雨 === */
        .falling-hearts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(6px, 1vw, 14px);
            font-size: clamp(16px, 3vw, 30px);
            margin: clamp(4px, 0.6vh, 10px) 0;
            filter: drop-shadow(0 4px 20px rgba(255, 130, 170, 0.06));
        }
        .falling-hearts span {
            display: inline-block;
            animation: heartFloat 4.2s ease-in-out infinite alternate;
        }
        .falling-hearts span:nth-child(1) { animation-delay: 0s; }
        .falling-hearts span:nth-child(2) { animation-delay: 0.4s; }
        .falling-hearts span:nth-child(3) { animation-delay: 0.9s; }
        .falling-hearts span:nth-child(4) { animation-delay: 1.5s; }
        .falling-hearts span:nth-child(5) { animation-delay: 0.6s; }
        .falling-hearts span:nth-child(6) { animation-delay: 2.0s; }
        .falling-hearts span:nth-child(7) { animation-delay: 1.2s; }
        .falling-hearts span:nth-child(8) { animation-delay: 0.8s; }

        @keyframes heartFloat {
            0% { transform: translateY(6px) scale(0.85) rotate(-6deg); opacity: 0.5; }
            100% { transform: translateY(-12px) scale(1.1) rotate(8deg); opacity: 1; }
        }

        /* === 诗句卡片 === */
        .poem-card {

            max-width: 94%;
            margin: clamp(2px, 0.3vh, 6px) 0;
        }
        .poem-line {
            font-size: clamp(12px, 1.6vw, 17px);
            color: #7a5f6b;
            letter-spacing: clamp(1px, 0.3vw, 3px);
            font-weight: 300;
            line-height: 1.6;
        }
        .poem-line i {
            font-style: normal;
            color: #d47a96;
            font-weight: 400;
        }
        .poem-line small {
            display: block;
            margin-top: 2px;
            font-size: clamp(9px, 1vw, 12px);
            opacity: 0.6;
            letter-spacing: clamp(2px, 0.4vw, 4px);
            color: #b28a98;
        }

        /* === 牛郎织女 === */
        .lovers {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(8px, 1.6vw, 20px);
            flex-wrap: wrap;
            margin: clamp(2px, 0.3vh, 6px) 0;
        }
        .lover-item {
            display: flex;
            align-items: center;
            gap: clamp(4px, 0.6vw, 10px);
            background: rgba(255, 230, 240, 0.30);
            padding: clamp(3px, 0.4vh, 6px) clamp(12px, 2vw, 22px);
            border-radius: 80px;
            border: 1px solid rgba(255, 200, 215, 0.15);
            backdrop-filter: blur(2px);
            color: #7a5f6b;
            font-size: clamp(10px, 1.2vw, 15px);
            transition: all 0.2s;
            cursor: default;
        }
        .lover-item:hover {
            background: rgba(255, 220, 235, 0.50);
            transform: scale(1.03);
        }
        .lover-item .emoji {
            font-size: clamp(16px, 2.2vw, 26px);
        }
        .lover-item.heart-bridge {
            background: transparent;
            border: none;
            padding: 0 clamp(4px, 0.6vw, 10px);
            font-size: clamp(22px, 3vw, 36px);
            color: #f28aa8;
            animation: pulseHeart 2.4s ease-in-out infinite;
            cursor: default;
        }
        .lover-item.heart-bridge:hover {
            transform: none;
            background: transparent;
        }

        /* === 底部 === */
        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(2px, 0.2vh, 4px);
            margin-top: clamp(4px, 0.6vh, 10px);
        }
        .date-tag {
            font-size: clamp(9px, 0.9vw, 12px);
            color: #b58a98;
            background: rgba(255, 230, 240, 0.30);
            padding: clamp(3px, 0.3vh, 6px) clamp(14px, 2vw, 24px);
            border-radius: 80px;
            letter-spacing: clamp(2px, 0.4vw, 5px);
            border: 1px solid rgba(255, 200, 215, 0.15);
            backdrop-filter: blur(2px);
        }
        .date-tag strong {
            color: #d47a96;
            font-weight: 400;
        }
        .motto {
            font-size: 10px;
            color: #b3929e;
            opacity: 0.5;
            border-top: 1px solid rgba(200, 150, 170, 0.10);
            padding-top: clamp(4px, 0.4vh, 8px);
            width: 70%;
            text-align: center;
        }

        /* === 小屏设备微调 === */
        @media (max-width: 400px) {
            .card {
                border-radius: 32px;
                padding: 12px;
            }
            .confession::before,
            .confession::after {
                display: none;
            }
            .top-ornaments {
                gap: 6px;
                font-size: 14px;
            }
            .deco-scatter {
                display: none;
            }
            .deco-stars {
                display: none;
            }
            .deco-flower {
                display: none;
            }
            .deco-cloud {
                display: none;
            }
            .lover-item .emoji {
                font-size: 14px;
            }
            .lover-item.heart-bridge {
                font-size: 18px;
            }
        }

        @media (max-width: 360px) {
            .card {
                border-radius: 24px;
                padding: 10px;
            }
            .sub-greeting {
                letter-spacing: 1px;
                padding: 3px 10px;
                font-size: 9px;
            }
            .lovers {
                gap: 4px;
            }
            .lover-item {
                padding: 2px 8px;
                font-size: 9px;
            }
            .lover-item .emoji {
                font-size: 12px;
            }
            .lover-item.heart-bridge {
                font-size: 14px;
            }
            .falling-hearts {
                gap: 4px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ===== 纯CSS背景装饰 ===== -->

        <!-- 漂浮爱心 -->
        <div class="deco-heart-1">❤️</div>
        <div class="deco-heart-2">💗</div>

        <!-- 星星 -->
        <div class="deco-stars top-left">✦ ✧</div>
        <div class="deco-stars top-right">✧ ✦</div>
        <div class="deco-stars bottom-left">✦ ✧</div>
        <div class="deco-stars bottom-right">✧ ✦</div>

        <!-- 云朵 -->
        <div class="deco-cloud top">☁️</div>
        <div class="deco-cloud bottom">☁️</div>

        <!-- 花朵 -->
        <div class="deco-flower left">🌸</div>
        <div class="deco-flower right">🌺</div>

        <!-- 散落小爱心 -->
        <div class="deco-scatter">💕</div>
        <div class="deco-scatter">💗</div>
        <div class="deco-scatter">💖</div>
        <div class="deco-scatter">💝</div>
        <div class="deco-scatter">💘</div>

        <!-- ===== 主要内容 ===== -->
        <div class="content">

            <!-- 顶部装饰 -->
            <div class="top-ornaments">
                <span>✨</span>
                <span>☁️</span>
                <span class="heart-icon">💞</span>
                <span>🌷</span>
                <span>✨</span>
            </div>

            <!-- 主标题 -->
            <h1 class="title-qixi">七 夕</h1>

            <!-- 副标题 -->
            <div class="sub-greeting">✦ 星河为证 · 佳期如梦 ✦</div>

            <!-- 告白语 -->
            <div class="confession">我喜欢你</div>

            <!-- 爱心雨 -->
            <div class="falling-hearts">
                <span>💖</span>
                <span>🌸</span>
                <span>💗</span>
                <span>🌺</span>
                <span>💕</span>
                <span>💝</span>
                <span>💘</span>
            </div>

            <!-- 诗句 -->
            <div class="poem-card">
                <div class="poem-line">
                    <i> 两情若是久长时，又岂在朝朝暮暮</i>
                    <small>— 秦观 · 鹊桥仙— </small>
                </div>
            </div>

            <!-- ===== 牛郎织女 — 使用您提供的SVG ===== -->
            <div class="lovers-svg-container">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="100%" height="100%" style="font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: visible;">
                    <defs>
                        <linearGradient id="boyGrad_s" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#b8a0b0"/>
                            <stop offset="100%" stop-color="#8a7080"/>
                        </linearGradient>
                        <linearGradient id="girlGrad_s" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e8a0b8"/>
                            <stop offset="100%" stop-color="#c88098"/>
                        </linearGradient>
                        <radialGradient id="faceGrad_s" cx="50%" cy="40%" r="50%">
                            <stop offset="0%" stop-color="#fff5f0"/>
                            <stop offset="100%" stop-color="#f0ddd8"/>
                        </radialGradient>
                        <filter id="shadow_s" x="-10%" y="-10%" width="120%" height="120%">
                            <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(120,80,100,0.15)"/>
                        </filter>
                    </defs>

                    <!-- 牛郎 (左侧) -->
                    <g transform="translate(80, 10)" filter="url(#shadow_s)">
                        <!-- 背景光晕 -->
                        <ellipse cx="0" cy="18" rx="60" ry="12" fill="rgba(180,140,160,0.06)"/>
                        <!-- 身体 -->
                        <path d="M-16,38 L-12,20 L-4,16 L4,16 L12,20 L16,38 L12,42 L-12,42 Z" fill="url(#boyGrad_s)" opacity="0.9"/>
                        <path d="M-6,20 L-9,12 L9,12 L6,20" fill="none" stroke="#c0a8b8" stroke-width="1.2"/>
                        <!-- 衣领 -->
                        <path d="M-4,16 L0,12 L4,16 L0,20 Z" fill="#d4c0d0"/>
                        <!-- 头部 -->
                        <ellipse cx="0" cy="4" rx="14" ry="16" fill="url(#faceGrad_s)"/>
                        <!-- 头发 -->
                        <path d="M-14,0 Q-16,-8 -8,-12 Q-4,-14 0,-14 Q4,-14 8,-12 Q16,-8 14,0 Q8,-4 0,-4 Q-8,-4 -14,0 Z" fill="#5a4a50"/>
