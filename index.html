<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>七夕 · 我喜欢你</title>
    <style>
        /* === 全局重置 & 基础 === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 30% 40%, #fcf4f7 0%, #f5e6ed 50%, #f0e0e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 20px;
        }

        /* === 卡片容器 — 纯CSS实现，无SVG === */
        .card {
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: rgba(255, 245, 248, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 60px;
            border: 1.5px solid rgba(255, 220, 235, 0.5);
            box-shadow: 0 20px 60px rgba(180, 100, 130, 0.12);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: clamp(20px, 4vw, 60px);
            transition: all 0.2s;
        }

        /* === 背景装饰 — 纯CSS绘制 === */

        /* 光晕 */
        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, rgba(255, 150, 180, 0.15) 0%, transparent 70%);
            animation: glowPulse 5s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes glowPulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* 漂浮爱心 — 左上 */
        .heart-float-1 {
            position: absolute;
            top: 6%;
            left: 4%;
            font-size: clamp(40px, 6vw, 80px);
            opacity: 0.12;
            color: #f5a0b8;
            animation: floatHeart1 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatHeart1 {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(20px, -30px) rotate(10deg); }
            66% { transform: translate(-10px, 20px) rotate(-8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* 漂浮爱心 — 右下 */
        .heart-float-2 {
            position: absolute;
            bottom: 6%;
            right: 3%;
            font-size: clamp(50px, 8vw, 110px);
            opacity: 0.10;
            color: #f7b8c8;
            animation: floatHeart2 24s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes floatHeart2 {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-25px, 15px) rotate(-12deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* 星星群 — 左 */
        .stars-left {
            position: absolute;
            left: 6%;
            top: 25%;
            font-size: clamp(18px, 2.5vw, 36px);
            color: #f7d0b0;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: starSpin1 14s linear infinite;
        }
        @keyframes starSpin1 {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .stars-right {
            position: absolute;
            right: 6%;
            top: 20%;
            font-size: clamp(16px, 2.2vw, 32px);
            color: #f7d0b0;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: starSpin2 16s linear infinite;
        }
        @keyframes starSpin2 {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(-180deg) scale(1.15); }
            100% { transform: rotate(-360deg) scale(1); }
        }

        /* 云朵 */
        .cloud-left {
            position: absolute;
            left: 5%;
            top: 12%;
            font-size: clamp(50px, 8vw, 120px);
            color: rgba(255, 255, 255, 0.15);
            pointer-events: none;
            z-index: 0;
            animation: cloudMove1 30s ease-in-out infinite;
        }
        @keyframes cloudMove1 {
            0% { transform: translateX(0); }
            50% { transform: translateX(40px); }
            100% { transform: translateX(0); }
        }

        .cloud-right {
            position: absolute;
            right: 5%;
            bottom: 15%;
            font-size: clamp(60px, 9vw, 140px);
            color: rgba(255, 255, 255, 0.12);
            pointer-events: none;
            z-index: 0;
            animation: cloudMove2 32s ease-in-out infinite;
        }
        @keyframes cloudMove2 {
            0% { transform: translateX(0); }
            50% { transform: translateX(-30px); }
            100% { transform: translateX(0); }
        }

        /* 花朵装饰 */
        .flower-left {
            position: absolute;
            left: 8%;
            bottom: 22%;
            font-size: clamp(30px, 4vw, 60px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: flowerSway1 16s ease-in-out infinite;
        }
        @keyframes flowerSway1 {
            0% { transform: rotate(-8deg) translate(0, 0); }
            50% { transform: rotate(12deg) translate(8px, -10px); }
            100% { transform: rotate(-8deg) translate(0, 0); }
        }

        .flower-right {
            position: absolute;
            right: 7%;
            bottom: 30%;
            font-size: clamp(28px, 3.8vw, 55px);
            opacity: 0.10;
            pointer-events: none;
            z-index: 0;
            animation: flowerSway2 19s ease-in-out infinite;
        }
        @keyframes flowerSway2 {
            0% { transform: rotate(12deg) translate(0, 0); }
            50% { transform: rotate(-10deg) translate(-6px, 12px); }
            100% { transform: rotate(12deg) translate(0, 0); }
        }

        /* 小爱心散落 */
        .heart-scatter {
            position: absolute;
            font-size: clamp(20px, 2.8vw, 40px);
            opacity: 0.06;
            color: #f5a0b8;
            pointer-events: none;
            z-index: 0;
        }
        .heart-scatter:nth-child(1) { top: 55%; left: 14%; animation: floatScatter1 15s ease-in-out infinite; }
        .heart-scatter:nth-child(2) { top: 50%; right: 12%; animation: floatScatter2 17s ease-in-out infinite; }
        .heart-scatter:nth-child(3) { bottom: 38%; left: 45%; animation: floatScatter3 19s ease-in-out infinite; }
        .heart-scatter:nth-child(4) { top: 30%; left: 25%; animation: floatScatter4 13s ease-in-out infinite; }
        .heart-scatter:nth-child(5) { bottom: 20%; right: 28%; animation: floatScatter5 21s ease-in-out infinite; }

        @keyframes floatScatter1 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(12px,-18px) rotate(20deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes floatScatter2 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-15px,20px) rotate(-15deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes floatScatter3 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(18px,-12px) rotate(25deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes floatScatter4 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-10px,16px) rotate(-20deg); } 100% { transform: translate(0,0) rotate(0deg); } }
        @keyframes floatScatter5 { 0% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(14px,-14px) rotate(18deg); } 100% { transform: translate(0,0) rotate(0deg); } }

        /* === 内容区域 (z-index 高于装饰) === */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            gap: clamp(4px, 0.8vh, 12px);
        }

        /* === 顶部装饰 === */
        .top-ornaments {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2vw, 28px);
            flex-wrap: wrap;
            font-size: clamp(20px, 2.8vw, 44px);
            opacity: 0.6;
            margin-bottom: clamp(2px, 0.4vh, 8px);
        }
        .top-ornaments .heart-icon {
            color: #f28aa8;
            animation: pulseHeart 2.4s ease-in-out infinite;
        }
        @keyframes pulseHeart {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        /* === 主标题 === */
        .title-qixi {
            font-size: clamp(40px, 8vw, 96px);
            font-weight: 700;
            letter-spacing: clamp(8px, 1.6vw, 20px);
            background: linear-gradient(135deg, #f5a0b8, #f7b8c8, #f0b0c0);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: titleShimmer 6s ease-in-out infinite alternate;
            line-height: 1.1;
            text-shadow: 0 4px 40px rgba(240, 150, 180, 0.15);
        }
        @keyframes titleShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* === 副标题 === */
        .sub-greeting {
            font-size: clamp(12px, 1.4vw, 18px);
            font-weight: 300;
            color: #b3889a;
            background: rgba(255, 220, 235, 0.30);
            padding: clamp(4px, 0.6vh, 10px) clamp(16px, 3vw, 40px);
            border-radius: 80px;
            border: 1px solid rgba(255, 200, 215, 0.25);
            letter-spacing: clamp(4px, 0.8vw, 10px);
            display: inline-block;
            backdrop-filter: blur(2px);
            margin-bottom: clamp(2px, 0.3vh, 6px);
        }

        /* === 告白语 === */
        .confession {
            font-size: clamp(36px, 6.5vw, 80px);
            font-weight: 700;
            letter-spacing: clamp(8px, 1.2vw, 16px);
            background: linear-gradient(135deg, #f58aa8, #f06a90, #e8557a);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: confessionGlow 3s ease-in-out infinite alternate;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 60px rgba(235, 80, 120, 0.1);
        }
        @keyframes confessionGlow {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 20px rgba(255, 59, 127, 0.15)); }
            100% { background-position: 100% 50%; filter: drop-shadow(0 0 40px rgba(255, 59, 127, 0.25)); }
        }

        /* 告白语两侧装饰 (纯CSS) */
        .confession::before {
            content: '☁️';
            position: absolute;
            left: clamp(-40px, -5vw, -70px);
            top: clamp(-20px, -2vw, -30px);
            font-size: clamp(24px, 3vw, 40px);
            opacity: 0.35;
            animation: cloudFloat 5s ease-in-out infinite alternate;
        }
        .confession::after {
            content: '🌸';
            position: absolute;
            right: clamp(-44px, -5.5vw, -76px);
            bottom: clamp(-16px, -2vw, -24px);
            font-size: clamp(26px, 3.2vw, 44px);
            opacity: 0.35;
            animation: flowerFloat 6s ease-in-out infinite alternate;
        }
        @keyframes cloudFloat {
            0% { transform: translateY(0) scale(0.9); opacity: 0.25; }
            100% { transform: translateY(-12px) scale(1.1); opacity: 0.5; }
        }
        @keyframes flowerFloat {
            0% { transform: rotate(-6deg) scale(0.9); opacity: 0.25; }
            100% { transform: rotate(12deg) scale(1.1); opacity: 0.5; }
        }

        /* === 爱心雨 === */
        .falling-hearts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(8px, 1.2vw, 20px);
            font-size: clamp(20px, 3vw, 42px);
            margin: clamp(6px, 1vh, 16px) 0;
            filter: drop-shadow(0 4px 20px rgba(255, 130, 170, 0.08));
        }
        .falling-hearts span {
            display: inline-block;
            animation: heartFloat 4.2s ease-in-out infinite alternate;
        }
        .falling-hearts span:nth-child(1) { animation-delay: 0s; }
        .falling-hearts span:nth-child(2) { animation-delay: 0.4s; }
        .falling-hearts span:nth-child(3) { animation-delay: 0.9s; }
        .falling-hearts span:nth-child(4) { animation-delay: 1.5s; }
        .falling-hearts span:nth-child(5) { animation-delay: 0.6s; }
        .falling-hearts span:nth-child(6) { animation-delay: 2.0s; }
        .falling-hearts span:nth-child(7) { animation-delay: 1.2s; }
        .falling-hearts span:nth-child(8) { animation-delay: 0.8s; }

        @keyframes heartFloat {
            0% { transform: translateY(8px) scale(0.85) rotate(-6deg); opacity: 0.5; }
            100% { transform: translateY(-14px) scale(1.1) rotate(8deg); opacity: 1; }
        }

        /* === 诗句卡片 === */
        .poem-card {
            background: rgba(255, 240, 245, 0.40);
            backdrop-filter: blur(4px);
            border-radius: 80px;
            padding: clamp(10px, 1.2vh, 18px) clamp(20px, 3vw, 40px);
            border: 1px solid rgba(255, 200, 215, 0.2);
            box-shadow: 0 8px 28px rgba(200, 140, 170, 0.04);
            max-width: 92%;
            margin: clamp(4px, 0.5vh, 10px) 0;
        }
        .poem-line {
            font-size: clamp(14px, 1.6vw, 22px);
            color: #7a5f6b;
            letter-spacing: clamp(2px, 0.3vw, 4px);
            font-weight: 300;
            line-height: 1.6;
        }
        .poem-line i {
            font-style: normal;
            color: #d47a96;
            font-weight: 400;
        }
        .poem-line small {
            display: block;
            margin-top: 2px;
            font-size: clamp(10px, 1.1vw, 15px);
            opacity: 0.6;
            letter-spacing: clamp(3px, 0.4vw, 5px);
            color: #b28a98;
        }

        /* === 牛郎织女 === */
        .lovers {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(12px, 2vw, 30px);
            flex-wrap: wrap;
            margin: clamp(4px, 0.5vh, 10px) 0;
        }
        .lover-item {
            display: flex;
            align-items: center;
            gap: clamp(6px, 0.8vw, 12px);
            background: rgba(255, 230, 240, 0.30);
            padding: clamp(4px, 0.5vh, 8px) clamp(14px, 2vw, 28px);
            border-radius: 80px;
            border: 1px solid rgba(255, 200, 215, 0.15);
            backdrop-filter: blur(2px);
            color: #7a5f6b;
            font-size: clamp(12px, 1.2vw, 18px);
            transition: all 0.2s;
            cursor: default;
        }
        .lover-item:hover {
            background: rgba(255, 220, 235, 0.50);
            transform: scale(1.03);
        }
        .lover-item .emoji {
            font-size: clamp(20px, 2.2vw, 34px);
        }
        .lover-item.heart-bridge {
            background: transparent;
            border: none;
            padding: 0 clamp(4px, 0.6vw, 10px);
            font-size: clamp(28px, 3vw, 48px);
            color: #f28aa8;
            animation: pulseHeart 2.4s ease-in-out infinite;
            cursor: default;
        }
        .lover-item.heart-bridge:hover {
            transform: none;
            background: transparent;
        }

        /* === 底部 === */
        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(2px, 0.3vh, 6px);
            margin-top: clamp(6px, 0.8vh, 16px);
        }
        .date-tag {
            font-size: clamp(10px, 1vw, 14px);
            color: #b58a98;
            background: rgba(255, 230, 240, 0.30);
            padding: clamp(4px, 0.4vh, 8px) clamp(16px, 2.5vw, 32px);
            border-radius: 80px;
            letter-spacing: clamp(3px, 0.4vw, 6px);
            border: 1px solid rgba(255, 200, 215, 0.15);
            backdrop-filter: blur(2px);
        }
        .date-tag strong {
            color: #d47a96;
            font-weight: 400;
        }
        .motto {
            font-size: clamp(10px, 0.9vw, 13px);
            color: #b3929e;
            letter-spacing: clamp(3px, 0.4vw, 6px);
            opacity: 0.5;
            border-top: 1px solid rgba(200, 150, 170, 0.10);
            padding-top: clamp(6px, 0.6vh, 12px);
            width: 60%;
            text-align: center;
        }

        /* === 响应式：小屏微调 === */
        @media (max-width: 640px) {
            .card {
                border-radius: 32px;
                padding: 16px;
            }
            .confession::before,
            .confession::after {
                display: none;
            }
            .top-ornaments {
                gap: 8px;
            }
            .lover-item .emoji {
                font-size: 18px;
            }
            .lover-item.heart-bridge {
                font-size: 24px;
            }
            .heart-scatter {
                display: none;
            }
        }

        @media (max-width: 420px) {
            .card {
                border-radius: 20px;
                padding: 10px;
            }
            .sub-greeting {
                letter-spacing: 2px;
                padding: 4px 12px;
                font-size: 10px;
            }
            .lovers {
                gap: 6px;
            }
            .lover-item {
                padding: 3px 10px;
                font-size: 10px;
            }
            .lover-item .emoji {
                font-size: 14px;
            }
            .lover-item.heart-bridge {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ===== 纯CSS背景装饰 ===== -->

        <!-- 漂浮爱心 -->
        <div class="heart-float-1">❤️</div>
        <div class="heart-float-2">💗</div>

        <!-- 星星 -->
        <div class="stars-left">✦ ✧ ✦</div>
        <div class="stars-right">✦ ✧ ✦</div>

        <!-- 云朵 -->
        <div class="cloud-left">☁️</div>
        <div class="cloud-right">☁️</div>

        <!-- 花朵 -->
        <div class="flower-left">🌸</div>
        <div class="flower-right">🌺</div>

        <!-- 散落小爱心 -->
        <div class="heart-scatter">💕</div>
        <div class="heart-scatter">💗</div>
        <div class="heart-scatter">💖</div>
        <div class="heart-scatter">💝</div>
        <div class="heart-scatter">💘</div>

        <!-- ===== 主要内容 ===== -->
        <div class="content">

            <!-- 顶部装饰 -->
            <div class="top-ornaments">
                <span>✨</span>
                <span>☁️</span>
                <span class="heart-icon">💞</span>
                <span>🌷</span>
                <span>✨</span>
            </div>

            <!-- 主标题 -->
            <h1 class="title-qixi">七 夕</h1>

            <!-- 副标题 -->
            <div class="sub-greeting">✦ 星河为证 · 佳期如梦 ✦</div>

            <!-- 告白语 -->
            <div class="confession">我喜欢你</div>

            <!-- 爱心雨 -->
            <div class="falling-hearts">
                <span>💖</span>
                <span>🌸</span>
                <span>💗</span>
                <span>🌺</span>
                <span>💕</span>
                <span>💝</span>
                <span>💘</span>
                <span>🌷</span>
            </div>

            <!-- 诗句 -->
            <div class="poem-card">
                <div class="poem-line">
                    <i>“ 两情若是久长时，又岂在朝朝暮暮。”</i>
                    <small>—— 秦观 · 鹊桥仙</small>
                </div>
            </div>

            <!-- 牛郎织女 -->
            <div class="lovers">
                <span class="lover-item">
                    <span class="emoji">🐂</span> 牛郎
                </span>
                <span class="lover-item heart-bridge">🌉</span>
                <span class="lover-item">
                    <span class="emoji">🧚</span> 织女
                </span>
            </div>

            <!-- 底部 -->
            <div class="footer">
                <div class="date-tag">
                    <strong>♡</strong> 2026 · 农历七月初七 <strong>♡</strong>
                </div>
                <div class="motto">
                    愿我如星君如月 · 夜夜流光相皎洁
                </div>
            </div>

        </div>
    </div>

</body>
</html>
